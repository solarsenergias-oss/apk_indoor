name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar licencas do Android SDK (ja vem instalado no servidor)
        run: yes | sdkmanager --licenses || true

      - name: Permitir execucao do gradlew
        run: chmod +x gradlew

      - name: Compilar APK (debug)
        run: ./gradlew assembleDebug

      - name: Publicar APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: midia-indoor-player-apk
          path: app/build/outputs/apk/debug/app-debug.apk
